# apps/android is a Gradle project with no package.json, so pnpm ignores it (PLAN E-01).
packages:
  - apps/*
  - packages/*
  - tools/*

# Shared dev-tool versions. Reference them as "catalog:" in a package.json
# instead of repeating a version range.
catalog:
  "@tailwindcss/node": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  fast-check: ^4.10.2
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^5.0.3
  zod: ^4.6.6
  zod-openapi: ^6.0.2

# Refuse to install under an older Node than package.json "engines" allows.
engineStrict: true

# Install scripts each dependency may run (true) or not (false); pnpm fails on undecided ones.
# esbuild (pulled in by tsx) gets its binary from an optional platform package, so its
# postinstall check is not needed.
allowBuilds:
  esbuild: false
  # Pulled in by next-intl (message extraction tooling). Both ship prebuilt binaries in optional
  # platform packages; their install scripts only build from source / verify, so they stay off.
  "@parcel/watcher": false
  "@swc/core": false
